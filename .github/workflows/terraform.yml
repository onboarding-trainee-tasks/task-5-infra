name: Terraform CI/CD

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Terraform operation
        type: choice
        required: true
        default: plan
        options: [plan, apply]
      lambda_ref:
        description: Lambda branch, tag, or commit SHA
        type: string
        required: false
        default: main

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@v7
        with:
          path: task-5-infra
      - name: Checkout Lambda
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.LAMBDA_REPOSITORY }}
          ref: ${{ inputs.lambda_ref || 'main' }}
          path: task-5-lambda
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Build Lambda ZIPs
        working-directory: task-5-lambda
        run: bash build.sh
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - name: Terraform fmt
        working-directory: task-5-infra
        run: terraform fmt -check -recursive
      - name: Terraform init
        working-directory: task-5-infra
        run: terraform init -backend=false -input=false
      - name: Terraform validate
        working-directory: task-5-infra
        run: terraform validate -no-color

  plan:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@v7
        with:
          path: task-5-infra
      - name: Checkout Lambda
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.LAMBDA_REPOSITORY }}
          ref: ${{ inputs.lambda_ref || 'main' }}
          path: task-5-lambda
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Build Lambda ZIPs
        working-directory: task-5-lambda
        run: bash build.sh
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - name: AWS OIDC login
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Terraform init
        working-directory: task-5-infra
        run: terraform init -input=false
      - name: Create plan
        working-directory: task-5-infra
        run: terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan
      - name: Show plan
        working-directory: task-5-infra
        run: terraform show -no-color tfplan
      - name: Encrypt deployment files
        if: inputs.operation == 'apply'
        env:
          TF_PLAN_KEY: ${{ secrets.TF_PLAN_ENCRYPTION_KEY }}
        run: |
          set -e
          test -n "$TF_PLAN_KEY"
          tar -czf deployment.tar.gz task-5-infra/tfplan task-5-infra/.terraform.lock.hcl task-5-lambda/dist/lambda-function.zip task-5-lambda/dist/requests-layer.zip
          openssl enc -aes-256-cbc -pbkdf2 -iter 100000 \
            -in deployment.tar.gz -out deployment.tar.gz.enc \
            -pass env:TF_PLAN_KEY
      - name: Upload encrypted artifact
        if: inputs.operation == 'apply'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-deployment
          path: deployment.tar.gz.enc
          if-no-files-found: error
          retention-days: 7

  apply:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'apply'
    needs: plan
    runs-on: ubuntu-latest
    environment: T5-deploy
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@v7
        with:
          path: task-5-infra
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - name: AWS OIDC login
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Download encrypted artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-deployment
      - name: Decrypt deployment files
        env:
          TF_PLAN_KEY: ${{ secrets.TF_PLAN_ENCRYPTION_KEY }}
        run: |
          set -e
          test -n "$TF_PLAN_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 \
            -in deployment.tar.gz.enc -out deployment.tar.gz \
            -pass env:TF_PLAN_KEY
          tar -xzf deployment.tar.gz
      - name: Terraform init
        working-directory: task-5-infra
        run: terraform init -input=false -lockfile=readonly
      - name: Apply saved plan
        working-directory: task-5-infra
        run: terraform apply -input=false -lock-timeout=5m tfplan
