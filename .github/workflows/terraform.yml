name: Terraform CI/CD

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      lambda_ref:
        description: Lambda repository branch, tag or commit SHA
        required: false
        default: main

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

  LAMBDA_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.lambda_ref || 'main' }}


jobs:

  plan:
    name: Terraform Plan

    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    concurrency:
      group: terraform-plan-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Checkout infrastructure repository
        uses: actions/checkout@v7
        with:
          path: task-5-infra

      - name: Checkout Lambda repository
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.LAMBDA_REPOSITORY }}
          ref: ${{ env.LAMBDA_REF }}
          path: task-5-lambda

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build Lambda packages
        working-directory: task-5-lambda
        run: bash build.sh

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Authenticate to AWS through OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: terraform-plan-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Show AWS identity
        run: aws sts get-caller-identity

      - name: Terraform format check
        working-directory: task-5-infra
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: task-5-infra
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: task-5-infra
        run: terraform validate -no-color

      - name: Terraform plan
        working-directory: task-5-infra
        run: >-
          terraform plan
          -input=false
          -no-color
          -lock-timeout=5m


  apply:
    name: Terraform Apply

    if: >
      (github.event_name == 'push' &&
      github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    environment:
      name: T5-deploy

    concurrency:
      group: terraform-apply-main
      cancel-in-progress: false

    steps:
      - name: Checkout infrastructure repository
        uses: actions/checkout@v7
        with:
          path: task-5-infra

      - name: Checkout Lambda repository
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.LAMBDA_REPOSITORY }}
          ref: ${{ env.LAMBDA_REF }}
          path: task-5-lambda

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build Lambda packages
        working-directory: task-5-lambda
        run: bash build.sh

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Authenticate to AWS through OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: terraform-apply-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Show AWS identity
        run: aws sts get-caller-identity

      - name: Terraform init
        working-directory: task-5-infra
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: task-5-infra
        run: terraform validate -no-color

      - name: Create apply plan
        working-directory: task-5-infra
        run: >-
          terraform plan
          -input=false
          -no-color
          -lock-timeout=5m
          -out=tfplan

      - name: Show apply plan
        working-directory: task-5-infra
        run: terraform show -no-color tfplan

      - name: Terraform apply
        working-directory: task-5-infra
        run: terraform apply -input=false tfplan